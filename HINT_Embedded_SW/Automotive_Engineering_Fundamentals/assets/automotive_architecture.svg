<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Automotive Embedded Control Architecture</text>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="18" fill="#bfdbfe">Sensor → ECU / MCU → Network → Actuator</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="210" height="180" rx="22" fill="#ffffff"/>
    <rect x="360" y="160" width="210" height="180" rx="22" fill="#ffffff"/>
    <rect x="650" y="160" width="210" height="180" rx="22" fill="#ffffff"/>
    <rect x="940" y="160" width="190" height="180" rx="22" fill="#ffffff"/>
  </g>

  <text x="175" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">SENSORS</text>
  <text x="175" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Wheel Speed</text>
  <text x="175" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Steering / Yaw</text>
  <text x="175" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Radar / Camera</text>

  <text x="465" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">ECU / MCU</text>
  <text x="465" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">State Estimation</text>
  <text x="465" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Control Logic</text>
  <text x="465" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Diagnostics</text>

  <text x="755" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">NETWORK</text>
  <text x="755" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">CAN / LIN</text>
  <text x="755" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">ECU Coordination</text>
  <text x="755" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">V2X</text>

  <text x="1035" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">ACTUATORS</text>
  <text x="1035" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Brake</text>
  <text x="1035" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Steering</text>
  <text x="1035" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Motor / Throttle</text>

  <g stroke="#60a5fa" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M285 250 H345"/>
    <path d="M575 250 H635"/>
    <path d="M865 250 H925"/>
  </g>
  <g fill="#60a5fa">
    <polygon points="345,250 327,239 327,261"/>
    <polygon points="635,250 617,239 617,261"/>
    <polygon points="925,250 907,239 907,261"/>
  </g>

  <text x="600" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#dbeafe">Mechanical system + real-time embedded software + distributed communication</text>
</svg>